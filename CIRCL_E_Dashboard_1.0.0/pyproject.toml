[project]
name = "circl-e-dashboard"
version = "1.0.0"
description = "CIRCL-E local inference dashboard (frozen AI core + Streamlit UI)"
requires-python = ">=3.11"
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
  "tokenizers==0.23.2",
  "huggingface_hub==1.26.0",
  "timm==1.0.28",
  "safetensors==0.8.0",
  "einops==0.8.1",
  "scikit-learn==1.9.0",
  "numpy==2.1.3",
  "scipy==1.16.3",
  "pandas==2.3.3",
  "pillow==11.3.0",
  "joblib==1.5.2",
  "streamlit==1.52.2",
  "pydantic==2.12.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
